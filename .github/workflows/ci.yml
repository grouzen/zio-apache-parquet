name: Continuous Integration

on:
  push:
    branches: ['**']

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build and Test
    strategy:
      matrix:
        os: [ubuntu-latest]
        scala: [2.13.18, 3.10.0]
        java: [temurin@17]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java (temurin@17)
        if: matrix.java == 'temurin@17'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Lint Scala code
        run: sbt '++ ${{ matrix.scala }}; scalafix --check; scalafmtCheckAll'

      - name: Check explicit dependencies
        run: sbt '++ ${{ matrix.scala }}; all undeclaredCompileDependenciesTest; all unusedCompileDependenciesTest'

      - name: Build project
        run: sbt '++ ${{ matrix.scala }}; test'
